title = "FUEGO POC — gitleaks config"

[extend]
useDefault = true

# WHY: `ios/Podfile.lock` lists a SHA-1 checksum for every pod (`React-cxxstableapi:
# 1e0ad8a5ecb...`). The default `generic-api-key` rule matches them on entropy alone —
# they are public dependency digests generated by CocoaPods, not credentials, and they
# are regenerated on every `pod install`. Scoped to that one file and that one rule so a
# real key committed anywhere else, including elsewhere under ios/, still fails the gate.
[[rules]]
id = "generic-api-key"
[rules.allowlist]
description = "CocoaPods dependency checksums in Podfile.lock"
paths = ['''(^|/)ios/Podfile\.lock$''']

# The only real secret here is the Storefront token, which lives in `.env` (gitignored)
# and reaches the app through react-native-config. It is never allowlisted: if it ever
# shows up in a tracked file, this gate must fail. See standards/security.md.
